[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpuv2-tile-lab"
version = "0.1.0"
description = "Qwen operator references, Tile programs and numerical validation"
requires-python = ">=3.11"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]
tile = ["pypto @ git+https://github.com/hw-native-sys/pypto.git@1e1236c187b4d4b971a9f8a4e196aeae349e60df"]

[tool.setuptools.packages.find]
include = ["pymodel*", "kernels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

